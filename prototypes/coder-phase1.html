<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CODIVIA — Real-world coding workspace (prototype)</title>
<style>
:root{
  --dark:#141210; --dark2:#24201c; --brand:#F26722; --brand-d:#C4501A; --brand-lt:#FFF1E7; --brand-ln:#F8CDAF;
  --navy:#0f2f56; --navy2:#16406f; --navy-lt:#EAF2FB; --navy-ln:#C9DCF1; --navy-mut:#BED3EC;
  --ink:#1A1A1A; --ink2:#3B3B3B; --muted:#6E6A64; --line:#E6E3DE; --line2:#F1EFEB; --bg:#F4F3F0; --white:#fff;
  --ok:#0B7A55; --ok-lt:#E4F5EE; --warn:#9A6200; --warn-lt:#FFF5DC; --warn-ln:#F2D489; --err:#B42318; --err-lt:#FDECEA; --err-ln:#F4B9B2;
  --mono:"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
  --r:10px; --sh:0 1px 2px rgba(20,18,16,.05),0 4px 14px rgba(20,18,16,.05);
  font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;height:100%}
body{display:flex;flex-direction:column}
#app{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow:auto}
button{font:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:not-allowed;opacity:.5}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #F8B98F;outline-offset:1px}
.proto{background:#000;color:#bbb;font-size:12px;text-align:center;padding:5px}
.proto b{color:var(--brand)}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:18px;background:var(--dark);color:#fff;padding:0 22px;height:58px}
.logo{font-weight:900;font-size:19px;letter-spacing:1.5px}
.logo i{font-style:normal;color:var(--brand)}
.crumb{font-size:14px;color:#A9A39B}
.crumb b{color:#fff;font-weight:700}
.crumb span{margin:0 8px;color:#5f5a54}
.sp{flex:1}
.timer{font-family:var(--mono);font-size:14px;background:var(--dark2);border:1px solid #3a342e;border-radius:8px;padding:6px 12px}
.timer small{color:#A9A39B;font-family:inherit;margin-right:6px;font-size:12px}
.role{background:#3a1d0c;color:#FFB48A;border:1px solid #7a3a14;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:800;letter-spacing:.4px}
.user{font-weight:700;font-size:14px}

/* ---------- generic ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 16px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:14px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:#cfcac3;background:#FBFAF8}
.btn.sm{height:32px;padding:0 11px;font-size:13px;border-radius:7px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--brand-d);border-color:var(--brand-d)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover:not(:disabled){background:var(--line2)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.err{background:var(--err-lt);color:var(--err)}
.pill.warn{background:var(--warn-lt);color:var(--warn)}
.pill.ok{background:var(--ok-lt);color:var(--ok)}
.pill.gray{background:var(--line2);color:var(--muted)}
.pill.navy{background:var(--navy-lt);color:var(--navy)}
.pill.brand{background:var(--brand-lt);color:var(--brand-d)}
.code{font-family:var(--mono);font-weight:700;letter-spacing:.2px}
.muted{color:var(--muted)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;font-weight:700;color:var(--muted)}
.inp{height:40px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:#fff;font-size:14px;width:100%}
.inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-lt)}
textarea.inp{height:auto;padding:10px 12px;resize:vertical;min-height:90px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--line2);gap:2px}
.seg button{border:none;background:transparent;padding:6px 14px;border-radius:7px;font-size:13.5px;font-weight:700;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.empty{border:1.5px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:12px 20px;border-radius:10px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:200}

/* ---------- queue view ---------- */
.qwrap{display:grid;grid-template-columns:290px 1fr;gap:20px;padding:22px;max-width:1600px;margin:0 auto;align-items:start}
.qmain{padding:0;overflow:hidden}
.qhead{display:flex;align-items:center;gap:14px;padding:18px 20px 0}
.qhead h1{margin:0;font-size:21px}
.qhead .id{font-family:var(--mono);color:var(--muted);font-size:14px}
.qtabs{display:flex;gap:4px;padding:14px 20px 0;border-bottom:1px solid var(--line)}
.qtab{border:none;background:none;padding:10px 14px;font-weight:700;font-size:14px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.qtab.on{color:var(--ink);border-bottom-color:var(--brand)}
.qtab span{margin-left:6px;background:var(--line2);border-radius:999px;padding:1px 8px;font-size:12px}
.filters{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr)) auto;gap:12px;padding:16px 20px;background:#FCFBFA;border-bottom:1px solid var(--line);align-items:end}
table.grid{width:100%;border-collapse:collapse}
.grid th{text-align:left;font-size:12.5px;font-weight:700;color:var(--muted);padding:11px 14px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;white-space:nowrap}
.grid td{padding:13px 14px;border-bottom:1px solid var(--line2);font-size:14px;vertical-align:middle}
.grid tbody tr{cursor:pointer}
.grid tbody tr:hover td{background:#FFF8F2}
.score{display:inline-grid;place-items:center;width:38px;height:28px;border-radius:7px;background:var(--navy-lt);color:var(--navy);font-weight:800;font-size:13px}

/* ---------- departments ---------- */
.qpage{max-width:1500px;margin:0 auto;padding:22px}
.phead{margin:14px 0 18px}
.phead h1{margin:0 0 4px;font-size:24px}
.phead p{margin:0;color:var(--muted)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.dcard{text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--sh)}
.dcard:hover{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-lt)}
.dn{font-size:17px;font-weight:800}
.ds{font-size:13px;color:var(--muted);margin:3px 0 14px}
.dstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dstats b{display:block;font-size:20px}
.dstats span{font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:9px;background:var(--line2);margin:14px 0 12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.dtypes{display:flex;gap:6px;flex-wrap:wrap}
.srow{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--sh)}
.stat span{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.stat b{display:block;font-size:26px;margin:4px 0 2px}
.stat small{color:var(--muted);font-size:12.5px}
.stat.teal b{color:var(--brand-d)}
.typebar{display:flex;gap:6px;padding:14px 20px 0;flex-wrap:wrap}
.grid tbody tr{cursor:default}
.acc{display:inline-block;font-weight:800;border-radius:7px;padding:3px 9px}
.acc.hi{background:var(--ok-lt);color:var(--ok)}.acc.mid{background:var(--warn-lt);color:var(--warn)}.acc.lo{background:var(--err-lt);color:var(--err)}

/* ---------- workspace ---------- */
.wbar{display:flex;align-items:center;gap:10px;padding:10px 22px;background:#fff;border-bottom:1px solid var(--line)}
.wbar .q{font-weight:800}
.wbar .q small{font-family:var(--mono);font-weight:600;color:var(--muted);margin-left:6px;font-size:13px}
.banner{display:flex;flex-wrap:wrap;align-items:stretch;background:linear-gradient(180deg,var(--navy),var(--navy2));color:#fff;padding:0 10px}
.banner .who{padding:12px 14px;min-width:220px}
.banner .who .nm{font-size:19px;font-weight:800;letter-spacing:.2px}
.banner .who .sub{font-size:13px;color:var(--navy-mut);margin-top:2px}
.banner .who .tags{display:flex;gap:6px;margin-top:6px}
.btag{font-size:11.5px;font-weight:800;letter-spacing:.4px;border-radius:5px;padding:2px 8px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3)}
.btag.alert{background:#7a1f15;border-color:#b5483b}
.bf{padding:12px 16px;border-left:1px solid rgba(255,255,255,.14)}
.bf span{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--navy-mut)}
.bf b{display:block;font-size:14.5px;margin-top:3px;font-weight:700}
.bf b.m{font-family:var(--mono);font-size:14px}

.ws{flex:1;min-height:0;display:grid;grid-template-columns:minmax(330px,.85fr) minmax(660px,1.4fr) 320px;gap:16px;padding:16px 22px}
.ws.closed{grid-template-columns:minmax(380px,1fr) minmax(660px,1.4fr) 52px}
.panel{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ph{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.ph h2{margin:0;font-size:15px;font-weight:800}
.ph .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.pb{flex:1;overflow:auto;min-height:0}
.tabs{display:flex;flex-wrap:wrap;gap:2px;padding:0 10px;border-bottom:1px solid var(--line);background:#FCFBFA}
.tab{border:none;background:none;padding:11px 12px;font-weight:700;font-size:13.5px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--brand)}

/* chart */
.note{padding:18px 22px}
.note .meta{font-size:13px;color:var(--muted);padding-bottom:12px;border-bottom:1px solid var(--line2);margin-bottom:14px}
.note h4{margin:16px 0 5px;font-size:12.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--brand-d)}
.note p{margin:0;font-size:15px;line-height:1.7;white-space:pre-wrap}
.vlist .v{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line2);cursor:pointer}
.vlist .v:hover{background:#FFF8F2}
.vlist .v.on{background:var(--navy-lt)}
.kv{display:grid;grid-template-columns:160px 1fr;gap:9px 14px;padding:18px 22px;font-size:14.5px}
.kv div:nth-child(odd){color:var(--muted);font-weight:600}
table.simple{width:100%;border-collapse:collapse;font-size:14px}
.simple th{text-align:left;font-size:12.5px;color:var(--muted);padding:10px 16px;border-bottom:1px solid var(--line)}
.simple td{padding:11px 16px;border-bottom:1px solid var(--line2)}

/* coding */
.sec{padding:16px 18px;border-bottom:1px solid var(--line2)}
.sec:last-child{border-bottom:none}
.sh{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:11px}
.sh h3{margin:0;font-size:14.5px;font-weight:800}
.sh .hint{font-size:13px;color:var(--muted)}
.sh .r{margin-left:auto;font-size:12.5px;color:var(--muted)}
.dx{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;background:#fff}
.dx.over{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-lt)}
.dx.dragging{opacity:.45}
.grip{cursor:grab;color:#B0AAA2;font-size:18px;line-height:1;user-select:none}
.letter{width:28px;height:28px;flex:0 0 auto;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13.5px}
.dx .code{font-size:15px;min-width:78px}
.dx .desc{flex:1;font-size:14px}
.ibtn{border:none;background:none;width:30px;height:30px;border-radius:7px;color:var(--muted);font-size:14px}
.ibtn:hover:not(:disabled){background:var(--line2);color:var(--ink)}
.ibtn.x:hover{background:var(--err-lt);color:var(--err)}
.search{position:relative}
.search .inp{padding-left:38px}
.search::before{content:"⌕";position:absolute;left:13px;top:8px;font-size:18px;color:var(--muted)}
.drop{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.14);z-index:40;max-height:300px;overflow:auto}
.drop .it{display:grid;grid-template-columns:86px 58px 1fr;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line2);cursor:pointer;font-size:14px}
.drop .it:hover{background:var(--brand-lt)}
.drop .sys{font-size:11.5px;font-weight:800;color:var(--muted);padding-top:2px}

.los{display:grid;grid-template-columns:auto 1fr;gap:12px 16px;align-items:center}
.los .lbl{font-size:13px;font-weight:700;color:var(--muted)}
.lvls{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv{border:1px solid var(--navy-ln);background:var(--navy-lt);color:var(--navy);border-radius:9px;padding:9px 6px;text-align:center}
.lv .code{display:block;font-size:15.5px}
.lv small{display:block;font-size:12px;color:#4f6c8e;margin-top:2px;font-weight:600}
.lv.on{background:var(--navy);border-color:var(--navy);color:#fff}
.lv.on small{color:var(--navy-mut)}
.lv:hover:not(.on){border-color:var(--navy)}
.time{width:90px}

table.lines{width:100%;border-collapse:separate;border-spacing:0}
.lines th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:700;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.lines td{padding:10px 6px;border-bottom:1px solid var(--line2);vertical-align:middle;font-size:14px}
.lines tr.hl td{background:#FFF8E6}
.lines tr.flag td:first-child{box-shadow:inset 3px 0 0 var(--err)}
.lines tr.wflag td:first-child{box-shadow:inset 3px 0 0 #E0A526}
.lines .ln{font-weight:800;color:var(--muted);width:26px}
.lines .code{font-size:15px}
.lines .ds{font-size:12.5px;color:var(--muted);max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mods{display:flex;gap:4px}
.mod{width:42px;height:34px;border:1px solid var(--line);border-radius:7px;text-align:center;font-family:var(--mono);font-weight:700;font-size:14px;text-transform:uppercase;background:#fff}
.mod.f{background:var(--brand-lt);border-color:var(--brand-ln);color:var(--brand-d)}
.mod:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-lt)}
.units{width:58px;height:34px;border:1px solid var(--line);border-radius:7px;text-align:center;font-size:14px}
.ptrs{display:flex;gap:4px;flex-wrap:wrap}
.pc{width:28px;height:28px;border-radius:8px;border:1px solid var(--navy-ln);background:#fff;color:#5d7ea5;font-weight:800;font-size:13px}
.pc.on{background:var(--navy);border-color:var(--navy);color:#fff}
.amt{font-family:var(--mono);text-align:right;white-space:nowrap}
.tot td{border-bottom:none;font-weight:800;padding-top:12px}
.chg{background:#FFF1C9;border-radius:4px;padding:0 4px}
.del{text-decoration:line-through;color:var(--err)}
.add{color:var(--ok);font-weight:700}
.remit{font-family:var(--mono);font-weight:800;font-size:12.5px}

/* edits sidebar */
.rail{display:flex;flex-direction:column;align-items:center;padding-top:12px;gap:10px}
.rail button{writing-mode:vertical-rl;transform:rotate(180deg);border:none;background:var(--navy);color:#fff;border-radius:8px;padding:14px 8px;font-weight:800;font-size:13px}
.efilters{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.chipf{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
.chipf.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.edit{margin:12px 14px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.edit .eh{display:flex;align-items:center;gap:8px;padding:9px 12px;font-weight:800;font-size:13.5px}
.edit.err .eh{background:var(--err-lt);color:var(--err)}
.edit.warn .eh{background:var(--warn-lt);color:var(--warn)}
.edit.acked{opacity:.6}
.edit .eb{padding:10px 12px;font-size:13.5px;line-height:1.5}
.edit .rule{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:4px}
.edit .ef{display:flex;gap:8px;padding:0 12px 11px}
.clean{margin:16px;padding:16px;border-radius:10px;background:var(--ok-lt);color:var(--ok);font-weight:700;text-align:center}
.act{padding:10px 16px;border-top:1px solid var(--line2);font-size:13px}
.act .t{color:var(--muted);font-size:12px}
.payer{margin:12px 14px;padding:12px;border-radius:10px;background:var(--navy-lt);font-size:13.5px;line-height:1.5;color:#1d3f66}
.payer b{display:block;margin-bottom:3px}

/* action bar */
.abar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line);background:#FCFBFA}
.abar .status{font-size:13.5px;font-weight:700}

/* modals */
.ov{position:fixed;inset:0;background:rgba(20,18,16,.45);display:grid;place-items:center;z-index:100;padding:20px}
.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.modal.wide{width:min(980px,100%)}
.mh{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.mh h2{margin:0;font-size:18px}
.mh .x{margin-left:auto}
.mb{padding:20px 22px;display:flex;flex-direction:column;gap:16px}
.mf{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--line);background:#FCFBFA}
.reasons{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.reasons label{display:flex;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line2);cursor:pointer;font-size:14px}
.reasons label:last-child{border-bottom:none}
.reasons label:hover{background:#FFF8F2}
.reasons .num{margin-left:auto;font-family:var(--mono);color:var(--muted);font-size:13px}

/* EOB */
.eob{padding:20px 22px;font-size:14px}
.eob .eh{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 20px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.eob .eh span{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.eob .eh b{font-size:14px}
.denied{display:flex;gap:14px;align-items:center;padding:14px 16px;margin:14px 16px 0;border-radius:10px;background:var(--err-lt);border:1px solid var(--err-ln)}
.denied .big{font-size:22px}
.denied b{display:block;color:var(--err);font-size:15px}
.decide{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{border:1.5px solid var(--line);border-radius:10px;padding:12px;background:#fff;text-align:left}
.opt b{display:block;font-size:14px;margin-bottom:3px}
.opt span{font-size:12.5px;color:var(--muted)}
.opt.on{border-color:var(--brand);background:var(--brand-lt)}
.steps{display:flex;gap:6px;padding:12px 16px;border-bottom:1px solid var(--line2);font-size:13px;font-weight:700;color:var(--muted)}
.steps span{display:flex;align-items:center;gap:6px}
.steps span i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--line2);font-size:12px}
.steps span.on{color:var(--ink)}
.steps span.on i{background:var(--brand);color:#fff}
.steps span.done i{background:var(--ok);color:#fff}
.steps .sep{color:#cfc9c1}

/* result */
.res{max-width:980px;margin:24px auto;padding:0 22px}
.rhead{display:flex;align-items:center;gap:22px;padding:24px}
.ring{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;font-size:30px;font-weight:900}
.ring.hi{background:var(--ok-lt);color:var(--ok)}
.ring.mid{background:var(--warn-lt);color:var(--warn)}
.ring.lo{background:var(--err-lt);color:var(--err)}
.chk{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:13px 22px;border-top:1px solid var(--line2)}
.chk .i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:900}
.chk .i.y{background:var(--ok-lt);color:var(--ok)}
.chk .i.n{background:var(--err-lt);color:var(--err)}
.chk b{font-size:14.5px}
.chk p{margin:3px 0 0;font-size:13.5px;color:var(--muted)}

/* ---------- inpatient facility (documents, evidence, encoder, POA, PCS, DRG) ---------- */
.ws.ip{grid-template-columns:minmax(520px,1fr) minmax(600px,1.15fr) 300px}
.ws.ip.closed{grid-template-columns:minmax(560px,1fr) minmax(640px,1.2fr) 52px}
.ipchart{display:grid;grid-template-columns:178px 1fr;flex:1;min-height:0}
.doclist{border-right:1px solid var(--line);overflow:auto;padding:8px}
.doclist .d{display:block;width:100%;text-align:left;border:none;background:none;border-radius:8px;padding:8px 9px;margin-bottom:2px}
.doclist .d:hover{background:var(--line2)}
.doclist .d.on{background:var(--navy-lt)}
.doclist .d b{display:block;font-size:13px;line-height:1.3}
.doclist .d small{font-size:11.5px;color:var(--muted)}
.doclist .evn{float:right;background:#FFE9A8;border-radius:5px;padding:0 6px;font-size:11px;font-weight:800}
.doclist .d.new b::after{content:" NEW";color:var(--ok);font-size:10.5px}
.doc{padding:18px 22px;font-size:14.5px;line-height:1.65}
.doc h3{margin:0 0 2px;font-size:17px}
.doc .meta{font-size:13px;color:var(--muted);padding-bottom:10px;border-bottom:1px solid var(--line2);margin-bottom:10px}
.doc h5{margin:16px 0 5px;font-size:12.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--brand-d)}
.doc p{margin:0 0 8px}
.doc table{border-collapse:collapse;font-size:13.5px;margin:6px 0}
.doc td,.doc th{border:1px solid var(--line);padding:5px 9px;text-align:left}
.doc .abn{color:var(--err);font-weight:700}
mark.ev{background:#FFE9A8;border-bottom:2px solid #E5B900;padding:0 1px;cursor:pointer}
mark.ev.flash{outline:3px solid var(--brand)}
mark.find{background:#C7E0FF}
.selpop{position:fixed;z-index:150;background:var(--dark);color:#fff;border-radius:10px;padding:6px;box-shadow:0 12px 30px rgba(0,0,0,.3);max-width:320px}
.selpop .h{font-size:12px;color:#A9A39B;padding:3px 6px 6px}
.selpop button{display:block;width:100%;text-align:left;background:none;border:0;color:#fff;padding:6px 8px;border-radius:6px;font-size:13px}
.selpop button:hover{background:var(--dark2)}
.selpop .code{color:#FFB48A}
.enc{padding:12px 16px;border-bottom:1px solid var(--line);background:#FCFBFA}
.enc .row{display:flex;gap:8px}
.encres{margin-top:8px;border:1px solid var(--line);border-radius:9px;max-height:220px;overflow:auto;background:#fff}
.er{display:grid;grid-template-columns:82px 1fr auto;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line2);cursor:pointer;font-size:13.5px}
.er:hover{background:var(--brand-lt)}
.er .path{font-size:12px;color:var(--muted)}
.tabular{margin-top:8px;border:1px solid var(--line);border-radius:9px;padding:12px;background:#fff}
.tabular .hier{font-size:12px;color:var(--muted);margin-bottom:6px}
.tnote{border-left:3px solid var(--line);padding:4px 10px;margin:6px 0;font-size:13px}
.tnote.ex1{border-color:var(--err);background:var(--err-lt)}
.tnote.ex2{border-color:#E0A526;background:var(--warn-lt)}
.tnote.ua{border-color:var(--navy);background:var(--navy-lt)}
.tnote b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
.badge{display:inline-block;border-radius:5px;padding:1px 6px;font-size:11px;font-weight:800;vertical-align:middle}
.badge.mcc{background:#F1EAFE;color:#7C3AED}.badge.cc{background:#E0F2FE;color:#0369A1}.badge.un{background:var(--line2);color:var(--muted)}
.poa{height:32px;border:1px solid var(--line);border-radius:7px;padding:0 6px;font-size:13px;background:#fff;max-width:150px}
.poa.missing{border-color:var(--err);background:var(--err-lt)}
.evchip{border:0;background:#FFE9A8;border-radius:5px;padding:1px 7px;font-size:12px;font-weight:700;margin-right:4px}
.evchip.none{background:var(--line2);color:var(--muted);cursor:default;font-weight:600}
.seqb{min-width:40px;text-align:center;font-weight:800;color:var(--muted);font-size:13px}
.seqb.p{background:var(--brand);color:#fff;border-radius:7px;padding:3px 0}
.pcs{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.pcs h6{margin:0 0 4px;font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);text-align:center}
.pcs button{display:block;width:100%;border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 4px;margin-bottom:4px;font-size:11.5px;line-height:1.25;text-align:left}
.pcs button b{font-family:var(--mono);color:var(--brand-d)}
.pcs button.on{border-color:var(--brand);background:var(--brand-lt)}
.pcsout{display:flex;align-items:center;gap:12px;margin-top:10px}
.pcsout .code{font-size:20px;letter-spacing:3px}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.drgt{border:1px solid var(--line);border-left:5px solid var(--brand);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.drgt .n{font-size:26px;font-weight:900}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.kpis div{border:1px solid var(--line);border-radius:10px;padding:10px}
.kpis span{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.kpis b{display:block;font-size:19px;margin-top:2px}
.edit.info .eh{background:var(--navy-lt);color:var(--navy)}
.qitem{margin:10px 14px;padding:10px 12px;border-radius:10px;background:var(--warn-lt);border:1px solid var(--warn-ln);font-size:13px}
.qitem.ans{background:var(--ok-lt);border-color:#a6dcc5}
.qopt{display:flex;gap:10px;align-items:center;padding:5px 0;font-size:14px}

  const g = grouper(w.dx), gOk = g && g.drg === K.drg;
  add(gOk, `MS-DRG ${g ? g.drg : '—'}` + (gOk ? ' matches the audit' : ` → audited MS-DRG ${K.drg}`), 'MS-DRG 189 (pulmonary edema & respiratory failure) follows from J96.01 as principal diagnosis. A different DRG means the hospital is paid the wrong amount.');
  return {checks, pct:Math.round(checks.filter(c => c.ok).length / checks.length * 100)};
}
const scoreAny = (action) => S.work.kind === 'ip' ? scoreIP(S.work, action) : scoreCoding(S.work, action);

/* =====================================================================
   EDITS ENGINE (charge review rules) — runs live on every change
   ===================================================================== */
const EXCLUDES1 = [['J01.01','J01.90'],['J01.00','J01.01'],['J01.00','J01.90'],['J01.01','J32.0'],['J01.00','J32.0'],['J45.20','J45.909']];
const SYMPTOMS_OF = {'R50.9':/^J01/,'R09.81':/^J01/,'R51.9':/^J01/};
const UNSPEC = ['J01.90','J01.00','J45.909','R51.9'];
function runEdits(w){
  const out = [];
  const add = (sev, rule, title, msg, line) => out.push({sev, rule, title, msg, line, key:rule + '|' + (line||'') + '|' + msg});
  const codes = w.dx.map(d => d.c);
  if (!codes.length) add('err', 900001, 'No diagnosis on the encounter', 'Add at least one diagnosis before submitting.');
  EXCLUDES1.forEach(([a,b]) => { if (codes.includes(a) && codes.includes(b)) add('err', 925383, 'Conflicting diagnosis (Excludes1)', `${a} and ${b} cannot be reported together. Check the Excludes1 note.`); });
  codes.forEach(c => { if (SYMPTOMS_OF[c] && codes.some(x => SYMPTOMS_OF[c].test(x))) add('warn', 930112, 'Sign/symptom with a confirmed diagnosis', `${c} (${icdInfo(c)[1]}) is usually part of the confirmed diagnosis and not coded separately.`); });
  if (codes[0] && /^R/.test(codes[0]) && codes.some(c => !/^R/.test(c))) add('warn', 930140, 'Primary diagnosis is a symptom code', `Diagnosis A is ${codes[0]}. A confirmed diagnosis that explains the visit should be listed first.`);
  codes.forEach(c => { if (UNSPEC.includes(c)) add('warn', 940210, 'Unspecified diagnosis', `${c} is unspecified. Check the documentation for a more specific code.`); });
  const seen = {};
  w.lines.forEach((l, i) => {
    const n = i + 1;
    if (!l.ptrs.length) add('err', 900010, 'Missing diagnosis pointer', `Line ${n} (${l.c}) is not linked to any diagnosis.`, n);
    if (seen[l.c]) add('err', 900030, 'Duplicate charge', `${l.c} appears on lines ${seen[l.c]} and ${n}. Use units instead.`, n);
    seen[l.c] = seen[l.c] || n;
    if (/^9920[2-5]$/.test(l.c) && CASE.pt.status === 'est') add('err', 915002, 'New-patient code on an established patient', `Line ${n}: ${l.c} is a new-patient code but this patient was last seen ${CASE.pt.lastSeen}.`, n);
    if (l.c === 'J0696' && l.units * 250 !== CASE.marDose) add('err', 961150, 'Drug units do not match administered dose', `Line ${n}: ${l.units} × 250 mg = ${l.units*250} mg billed, but the MAR shows ${CASE.marDose.toLocaleString()} mg given.`, n);
  });
  const emIdx = w.lines.findIndex(l => isEM(l.c));
  const hasProc = w.lines.some(l => !isEM(l.c) && !/^[JG]/.test(l.c));
  if (emIdx > -1 && hasProc && !w.lines[emIdx].mods.includes('25')) add('warn', 952363, 'E/M review for 25/59 modifier', 'Please review E/M codes if modifier 25 or 59 is needed when billed with other procedures.', emIdx + 1);
  if (w.lines.some(l => l.c === '96372') && !w.lines.some(l => /^J/.test(l.c))) add('warn', 961010, 'Injection without drug supply code', 'Line for 96372 has no matching drug (J-code) line.');
  w.dx.forEach((d, k) => { if (!w.lines.some(l => l.ptrs.includes(d.id))) add('warn', 900020, 'Diagnosis not linked to a charge', `${L(k)} · ${d.c} is not pointed to by any charge line.`); });
  return out;
}

/* =====================================================================
   SCORING (in the real app this runs on the server)
   ===================================================================== */
function scoreCoding(w, action){
  const K = CASE.key, checks = [];
  const add = (ok, title, why) => checks.push({ok, title, why});
  if (action !== 'submit'){
    add(false, 'Chosen action: ' + action, 'This encounter is billable and fully documented. It should have been corrected and resubmitted, not ' + (action === 'defer' ? 'deferred.' : 'transferred.'));
    return {checks, pct:0};
  }
  add(true, 'Correct action: fix and resubmit', 'The encounter is billable and the documentation supports every charge.');
  const codes = w.dx.map(d => d.c);
  add(codes[0] === K.dx[0], `Primary diagnosis ${codes[0] || '(none)'}` + (codes[0] === K.dx[0] ? '' : ` → should be ${K.dx[0]}`), K.why[K.dx[0]]);
  K.dx.slice(1).forEach(c => add(codes.includes(c), `Diagnosis ${c} ${codes.includes(c) ? 'reported' : 'missing'}`, K.why[c]));
  codes.filter(c => !K.dx.includes(c)).forEach(c => add(false, `Diagnosis ${c} should not be reported`, K.why[c] || 'Not supported by the documentation.'));
  const codeOf = (id) => (w.dx.find(d => d.id === id) || {}).c;
  K.lines.forEach(k => {
    const l = w.lines.find(x => x.c === k.c);
    if (!l){ add(false, `Charge ${k.c} missing`, K.why[k.c]); return; }
    const mods = l.mods.filter(m => m && !['JZ','JW'].includes(m)).sort().join(',');
    const kmods = k.mods.slice().sort().join(',');
    add(mods === kmods, `${k.c} modifiers: ${mods || 'none'}` + (mods === kmods ? '' : ` → should be ${kmods || 'none'}`), K.why[k.c]);
    add(l.units === k.units, `${k.c} units: ${l.units}` + (l.units === k.units ? '' : ` → should be ${k.units}`), k.c === 'J0696' ? K.why.J0696 : 'Units match the service performed.');
    const ptrs = l.ptrs.map(codeOf);
    const ok = ptrs[0] === k.ptrs[0] && k.ptrs.every(p => ptrs.includes(p)) && ptrs.every(p => k.ptrs.includes(p));
    add(ok, `${k.c} diagnosis pointers: ${ptrs.join(', ') || 'none'}` + (ok ? '' : ` → should be ${k.ptrs.join(', ')}`), 'Each charge points first to the diagnosis it treats.');
  });
  w.lines.filter(l => !K.lines.some(k => k.c === l.c)).forEach(l => add(false, `Charge ${l.c} should not be billed`, 'Not documented as performed, or included in another service.'));
  const pct = Math.round(checks.filter(c => c.ok).length / checks.length * 100);
  return {checks, pct};
}
function scoreDenial(w){
  const K = DENIAL.key, checks = [];
  const add = (ok, title, why) => checks.push({ok, title, why});
  add(w.decision === 'correct', 'Decision: ' + ({correct:'correct the charge and resubmit', appeal:'appeal', writeoff:'write off'}[w.decision] || '—'),
    'CO-4 means the modifier is wrong for the code. That is a billing error on our side, so the fix is a corrected claim, not an appeal or a write-off.');
  K.noMod25.forEach(c => { const l = w.lines.find(x => x.c === c); const ok = l && !l.mods.includes('25');
    add(ok, `${c}: modifier 25 ${ok ? 'removed' : 'still attached'}`, c === 'T1015' ? 'T1015 is the all-inclusive FQHC encounter code; modifier 25 is not valid on it and caused the CO-4.' : 'The E/M is bundled into the FQHC encounter rate, so there is no separate procedure to justify modifier 25.'); });
  add(w.dx[0] && w.dx[0].c === K.primary, `Primary diagnosis: ${w.dx[0] ? w.dx[0].c : 'none'}` + (w.dx[0] && w.dx[0].c === K.primary ? '' : ' → should be F41.1'),
    'The visit was for anxiety follow-up. A Z code for long-term drug therapy should not be listed first when the condition being treated is documented.');
  K.noMod25.forEach(c => { const l = w.lines.find(x => x.c === c); const first = l && (w.dx.find(d => d.id === l.ptrs[0]) || {}).c;
    add(first === K.primary, `${c} first diagnosis pointer: ${first || 'none'}` + (first === K.primary ? '' : ' → should be F41.1'),
      'Re-sequencing the diagnosis list is not enough — each line\'s first pointer must be the reason for that service.'); });
  K.keepLines.forEach(c => { const l = w.lines.find(x => x.c === c); const ok = l && !l.mods.some(Boolean);
    add(ok, `${c} left as billed`, 'CO-97 = paid as part of another service. Quality (Category II) codes are informational; no correction needed.'); });
  add(w.comment.trim().length >= 10, 'Correction comment entered', 'Every charge correction needs a comment saying what changed and why, for the audit trail.');
  add(w.notified, 'Charge review team notified of the pending session', 'Corrected charges sit in a pending queue until the charge review team processes them.');
  return {checks, pct: Math.round(checks.filter(c => c.ok).length / checks.length * 100)};
}

      <span class="code">${d.c}</span><span class="desc">${esc(d.d)}</span>
      ${i === 0 ? '<span class="pill brand">Primary</span>' : ''}
      <button class="ibtn" data-act="dxup" data-id="${d.id}" ${i===0?'disabled':''} title="Move up">▲</button>
      <button class="ibtn" data-act="dxdown" data-id="${d.id}" ${i===w.dx.length-1?'disabled':''} title="Move down">▼</button>
      ${opts && opts.noRemove ? '' : `<button class="ibtn x" data-act="dxrm" data-id="${d.id}" title="Remove">✕</button>`}
    </div>`).join('') : '<div class="empty">No diagnoses yet</div>'}</div>
    ${opts && opts.noAdd ? '' : `<div class="search" style="margin-top:8px"><input class="inp" data-search="dx" placeholder="Add a diagnosis — type a code or condition (e.g. sinusitis)" autocomplete="off"><div class="drop" hidden></div></div>`}
  </div>`;
}

function vLos(w){
  const em = w.lines.find(l => isEM(l.c));
  const grid = w.ptGrid === 'new'
    ? [['99202','Straightforward','15+ min'],['99203','Low','30+ min'],['99204','Moderate','45+ min'],['99205','High','60+ min']]
    : [['99211','Minimal','—'],['99212','Straightforward','10+ min'],['99213','Low','20+ min'],['99214','Moderate','30+ min'],['99215','High','40+ min']];
  const t = parseInt(w.time, 10); let hint = '';
  if (t > 0){ const fit = grid.filter(g => g[2] !== '—' && t >= parseInt(g[2], 10)).pop(); hint = fit ? `Time alone supports <b>${fit[0]}</b>` : 'Below the time thresholds'; }
  return `<div class="sec">
    <div class="sh"><h3>Level of service (E/M)</h3><span class="hint">Choosing a level puts it on charge line 1.</span></div>
    <div class="los">
      <span class="lbl">Patient</span>
      <div><div class="seg"><button data-act="ptgrid" data-v="new" class="${w.ptGrid==='new'?'on':''}">New</button><button data-act="ptgrid" data-v="est" class="${w.ptGrid==='est'?'on':''}">Established</button></div>
        <span class="muted" style="margin-left:10px;font-size:13px">Chart: established, last seen ${CASE.pt.lastSeen}</span></div>
      <span class="lbl">Level (MDM · time)</span>
      <div class="lvls" style="grid-template-columns:repeat(${grid.length},1fr)">${grid.map(g => `<button class="lv ${em && em.c===g[0]?'on':''}" data-act="level" data-c="${g[0]}"><span class="code">${g[0]}</span><small>${g[1]} · ${g[2]}</small></button>`).join('')}</div>
      <span class="lbl">Total time</span>
      <div style="display:flex;align-items:center;gap:10px"><input class="inp time" data-input="time" value="${esc(w.time)}" placeholder="min" inputmode="numeric"><span class="muted" id="timeHint">${hint}</span>
        <button class="btn sm" data-act="g2211" style="margin-left:auto">${w.lines.some(l=>l.c==='G2211') ? '✓ G2211 added' : '+ Add-on G2211'}</button></div>
    </div></div>`;
}

function vLines(w, edits, opts){
  opts = opts || {};
  const errLines = new Set(edits.filter(e => e.sev==='err' && e.line).map(e => e.line));
  const warnLines = new Set(edits.filter(e => e.sev==='warn' && e.line).map(e => e.line));
  const mode = opts.mode || 'current';
  const src = opts.original;
  let table;
  if (mode === 'original' || mode === 'compare'){
    const o = cloneSession(src);
    const codeOf = (s, id) => (s.dx.findIndex(d => d.id === id));
    const ptrTxt = (s, l) => l.ptrs.map(id => L(codeOf(s, id))).join(',') || '—';
    const ptrCodes = (s, l) => l.ptrs.map(id => (s.dx.find(d=>d.id===id)||{}).c).join(',');
    const rows = [];
    if (mode === 'original'){
      o.lines.forEach((l,i) => rows.push(`<tr><td class="ln">${i+1}</td><td><span class="code">${l.c}</span><div class="ds">${esc(l.d)}</div></td><td class="code">${l.mods.filter(Boolean).join(' ') || '—'}</td><td>${l.units}</td><td class="code">${ptrTxt(o,l)}</td><td class="amt">${money(l.fee*l.units)}</td></tr>`));
      table = `<div class="muted" style="margin-bottom:8px;font-size:13px">As entered by ${esc(CASE.enc.prov)} · Dx: ${o.dx.map((d,i)=>`<b>${L(i)}</b> ${d.c}`).join(' · ')}</div>
        <table class="lines"><thead><tr><th>#</th><th>Code</th><th>Modifiers</th><th>Units</th><th>Dx ptr</th><th style="text-align:right">Amount</th></tr></thead><tbody>${rows.join('')}</tbody></table>`;
    } else {
      const all = [...new Set([...o.lines.map(l=>l.c), ...w.lines.map(l=>l.c)])];
      all.forEach(c => {
        const a = o.lines.find(l=>l.c===c), b = w.lines.find(l=>l.c===c);
        const cell = (x, y) => x === y ? esc(y || '—') : `${x ? `<span class="del">${esc(x)}</span> ` : ''}<span class="chg add">${esc(y || '—')}</span>`;
        if (a && !b) rows.push(`<tr><td><span class="code del">${c}</span></td><td colspan="3" class="del">Removed</td></tr>`);
        else if (!a && b) rows.push(`<tr><td><span class="code add">${c}</span></td><td colspan="3" class="add">Added · mods ${b.mods.filter(Boolean).join(' ')||'—'} · units ${b.units} · dx ${ptrCodes(w,b)||'—'}</td></tr>`);
        else rows.push(`<tr><td><span class="code">${c}</span></td><td class="code">${cell(a.mods.filter(Boolean).join(' '), b.mods.filter(Boolean).join(' '))}</td><td>${cell(String(a.units), String(b.units))}</td><td class="code">${cell(ptrCodes(o,a), ptrCodes(w,b))}</td></tr>`);
      });
      const dxo = o.dx.map(d=>d.c).join(' · '), dxn = w.dx.map(d=>d.c).join(' · ');
      table = `<div style="margin-bottom:10px;font-size:13.5px"><b>Diagnoses</b><br>${dxo === dxn ? esc(dxn) : `<span class="del">${esc(dxo)}</span><br><span class="chg add">${esc(dxn || '—')}</span>`}</div>
        <table class="lines"><thead><tr><th>Code</th><th>Modifiers</th><th>Units</th><th>Dx pointers</th></tr></thead><tbody>${rows.join('')}</tbody></table>`;
    }
  } else {
    let total = 0;
    const rows = w.lines.map((l,i) => { const amt = l.fee * l.units; total += amt;
      return `<tr class="${errLines.has(i+1)?'flag':warnLines.has(i+1)?'wflag':''}" data-line="${l.id}">
        <td class="ln">${i+1}</td>
        <td><span class="code">${l.c}</span><div class="ds" title="${esc(l.d)}">${esc(l.d)}</div></td>
        <td><div class="mods">${l.mods.map((m,k) => `<input class="mod ${m?'f':''}" maxlength="2" list="modlist" value="${esc(m)}" data-mod="${k}" aria-label="Modifier ${k+1}">`).join('')}</div></td>
        <td><input class="units" type="number" min="1" value="${l.units}" data-units aria-label="Units"></td>
        <td><div class="ptrs">${w.dx.length ? w.dx.map((d,k) => `<button class="pc ${l.ptrs.includes(d.id)?'on':''}" data-act="ptr" data-dx="${d.id}" title="${d.c} — ${esc(d.d)}">${L(k)}</button>`).join('') : '<span class="muted">add dx</span>'}</div>
          ${l.ptrs.length ? `<div class="muted" style="font-size:12px;margin-top:3px">Order: ${l.ptrs.map(id => L(w.dx.findIndex(d=>d.id===id))).join(' → ')}</div>` : ''}</td>
        ${opts.remit ? `<td>${l.remit ? `<span class="pill ${l.remit==='CO-97'?'gray':'err'} remit" title="${esc(CARC[l.remit]||'')}">${l.remit}</span>` : '<span class="muted">—</span>'}</td>` : ''}
        <td class="amt">${money(amt)}</td>
        <td>${opts.noRemove ? '' : `<button class="ibtn x" data-act="lnrm" title="Remove line">✕</button>`}</td></tr>`; }).join('');
    table = w.lines.length ? `<table class="lines"><thead><tr><th>#</th><th>Code</th><th>Modifiers</th><th>Units</th><th>Dx pointers</th>${opts.remit?'<th>Remit</th>':''}<th style="text-align:right">Amount</th><th></th></tr></thead>
      <tbody>${rows}<tr class="tot"><td></td><td colspan="${opts.remit?5:4}" style="text-align:right">Total charges</td><td class="amt">${money(total)}</td><td></td></tr></tbody></table>`
      : '<div class="empty">No charge lines yet. Pick an E/M level above or add a procedure below.</div>';
  }
  return `<div class="sec">
    <div class="sh"><h3>Charge lines</h3><span class="hint">${mode==='current' ? 'Click letters to link diagnoses — first = main reason' : ''}</span>
      ${src ? `<span class="r"><div class="seg"><button data-act="lmode" data-v="current" class="${mode==='current'?'on':''}">Current</button><button data-act="lmode" data-v="original" class="${mode==='original'?'on':''}">Original</button><button data-act="lmode" data-v="compare" class="${mode==='compare'?'on':''}">Compare</button></div></span>` : ''}</div>
    ${table}
    ${mode === 'current' && !opts.noAdd ? `<div class="search" style="margin-top:10px"><input class="inp" data-search="cpt" placeholder="Add a charge line — type a CPT/HCPCS code or description" autocomplete="off"><div class="drop" hidden></div></div>` : ''}
  </div>`;
}

function vEdits(w, edits){
  if (!S.sidebar) return `<div class="rail"><button data-act="sidebar">Open sidebar · ${edits.filter(e=>e.sev==='err').length} errors</button></div>`;
  const errs = edits.filter(e => e.sev === 'err'), warns = edits.filter(e => e.sev === 'warn');
  const shown = edits.filter(e => S.efilter === 'all' || e.sev === S.efilter);
  return `<div class="card panel">
    <div class="ph"><h2>Edits</h2><div class="r"><button class="ibtn" data-act="sidebar" title="Close sidebar">⇥</button></div></div>
    <div class="efilters">
      <button class="chipf ${S.efilter==='all'?'on':''}" data-act="ef" data-v="all">All ${edits.length}</button>
      <button class="chipf ${S.efilter==='err'?'on':''}" data-act="ef" data-v="err">Errors ${errs.length}</button>
      <button class="chipf ${S.efilter==='warn'?'on':''}" data-act="ef" data-v="warn">Warnings ${warns.length}</button>
    </div>
    <div class="pb">
      ${shown.length ? shown.map(e => { const acked = e.sev === 'warn' && w.acks.has(e.key);
        return `<div class="edit ${e.sev} ${acked?'acked':''}">
          <div class="eh">${e.sev==='err' ? '⛔ Error' : '⚠ Warning'}${e.line ? `<span style="margin-left:auto" class="pill gray">Line ${e.line}</span>` : ''}</div>
          <div class="eb"><div class="rule">Rule ${e.rule}</div><b>${esc(e.title)}</b><div>${esc(e.msg)}</div></div>
          ${e.sev==='warn' ? `<div class="ef"><button class="btn sm" data-act="ack" data-k="${esc(e.key)}">${acked ? '✓ Reviewed' : 'Mark reviewed'}</button></div>` : ''}
        </div>`; }).join('') : `<div class="clean">✓ No ${S.efilter==='warn'?'warnings':S.efilter==='err'?'errors':'edits'}. ${S.efilter==='all'?'Ready to submit.':''}</div>`}
      <div class="ph" style="border-top:1px solid var(--line)"><h2>Activity</h2></div>
      ${w.mode === 'new' ? `<div class="act"><div class="t">09/23/2026 11:02</div>Note signed by ${esc(CASE.enc.prov)}</div>
      <div class="act"><div class="t">Today</div>Chart allocated to you for coding</div>`
      : `<div class="act"><div class="t">09/23/2026 10:55</div>Charges entered by ${esc(CASE.enc.prov)}</div>
      <div class="act"><div class="t">09/23/2026 10:56</div>Stopped by coding rules → charge review</div>`}
      ${w.comments.map(c => `<div class="act"><div class="t">Today ${c.t} · You</div>${esc(c.text)}</div>`).join('')}
      <div style="padding:10px 14px"><textarea class="inp" id="cmt" placeholder="Add a comment for the next person…" style="min-height:64px"></textarea>
        <button class="btn sm" data-act="comment" style="margin-top:8px">Add comment</button></div>
    </div></div>`;
}

function vCoding(){
  const w = S.work, edits = runEdits(w);
  const errs = edits.filter(e => e.sev === 'err').length;
  const openWarns = edits.filter(e => e.sev === 'warn' && !w.acks.has(e.key)).length;
  const ready = !errs && !openWarns;
  const status = errs ? `<span style="color:var(--err)">⛔ ${errs} error${errs>1?'s':''} must be fixed</span>`
    : openWarns ? `<span style="color:var(--warn)">⚠ ${openWarns} warning${openWarns>1?'s':''} to review</span>`
    : `<span style="color:var(--ok)">✓ All edits cleared</span>`;
  const isNew = w.mode === 'new', row = ROWS.find(r => r.id === S.openRow) || {}, same = ROWS.filter(r => r.type === w.mode && r.status === 'active');
  return `
    <div class="wbar"><button class="btn sm" data-act="back">← Back to chart list</button>
      <span class="q">Evaluation &amp; Management<small>${S.openRow}</small></span>
      <span class="pill ${TYPE[w.mode].cls}">${TYPE[w.mode].label}</span><span class="pill gray">Chart ${Math.max(1, same.indexOf(row) + 1)} of ${Math.max(1, same.length)}</span>
      <div class="sp"></div>
      <button class="btn sm" data-act="lookup">⌕ CODIVIA Code Search</button>
    </div>
    ${vBanner(CASE.pt, CASE.enc, `<span class="btag">ESTABLISHED</span>`)}
    <div class="ws ${S.sidebar?'':'closed'}">
      ${vChartPanel()}
      <div class="card panel">
        <div class="ph"><h2>${isNew ? 'Coding' : 'Charge review'}</h2><div class="r"><span class="pill ${isNew ? 'navy' : 'brand'}">${isNew ? 'Code from the documentation' : 'Stopped by rules'}</span></div></div>
        <div class="pb">${vDx(w)}${vLos(w)}${vLines(w, edits, {mode:isNew ? 'current' : S.linesMode, original:isNew ? null : CASE.original})}</div>
        <div class="abar"><span class="status">${status}</span><div class="sp"></div>
          <button class="btn" data-act="defer">Defer</button><button class="btn" data-act="transfer">Transfer</button>
          <button class="btn primary" data-act="submit" ${ready?'':'disabled'} title="${ready?'':'Fix errors and review warnings first'}">${isNew ? 'Submit for scoring ▸' : 'Resubmit charges ▸'}</button></div>
      </div>
      ${vEdits(w, edits)}
    </div>`;
}

function vDenial(){
  const w = S.work, D = DENIAL, I = D.invoice;
  const tabs = [['eob','EOB'],['claim','Claim as billed'],['note','Progress note'],['history','Account activity']];
  let body = '';
  if (S.chartTab === 'eob'){
    const o = D.billed;
    body = `<div class="eob">
      <div class="eh"><div><span>Payer</span><b>${D.enc.payer}</b></div><div><span>Claim number</span><b class="code">${I.num}</b></div><div><span>ICN</span><b class="code">${I.icn}</b></div>
        <div><span>Patient</span><b>${D.pt.name}</b></div><div><span>Member ID</span><b class="code">${D.enc.member}</b></div><div><span>Received</span><b>${I.received}</b></div></div>
      <table class="simple"><thead><tr><th>Code</th><th>DOS</th><th>Mod</th><th>Units</th><th style="text-align:right">Billed</th><th style="text-align:right">Allowed</th><th style="text-align:right">Paid</th><th>Reason</th></tr></thead><tbody>
      ${o.lines.map(l => { const fee = cptInfo(l.c)[2]; return `<tr><td class="code">${l.c}</td><td>${D.enc.dos}</td><td class="code">${l.mods.join(' ')||'—'}</td><td>${l.units}</td><td class="amt">${money(fee)}</td><td class="amt">${money(0)}</td><td class="amt">${money(0)}</td><td>${l.remit ? `<span class="pill ${l.remit==='CO-97'?'gray':'err'} remit">${l.remit}</span>` : ''}</td></tr>`; }).join('')}
      <tr class="tot"><td colspan="4"><b>Total</b></td><td class="amt"><b>${money(I.billed)}</b></td><td class="amt">${money(0)}</td><td class="amt">${money(0)}</td><td></td></tr></tbody></table>
      <h4 style="margin:18px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)">Reason code descriptions</h4>
      ${['CO-4','CO-97'].map(c => `<div style="padding:8px 0;border-bottom:1px solid var(--line2)"><span class="remit">${c}</span> — ${CARC[c]}</div>`).join('')}
      <p class="muted" style="font-size:13px">CO = contractual obligation (provider's responsibility, cannot bill the patient). PI = payer-initiated reduction.</p></div>`;
  }
  if (S.chartTab === 'claim') body = `<div class="note"><div class="meta">Diagnoses as billed: ${D.billed.dx.map((c,i)=>`<b>${L(i)}</b> ${c}`).join(' · ')}</div>
      <table class="simple"><thead><tr><th>Code</th><th>Mods</th><th>Units</th><th>Dx pointers</th></tr></thead><tbody>${D.billed.lines.map(l=>`<tr><td class="code">${l.c}</td><td class="code">${l.mods.join(' ')||'—'}</td><td>${l.units}</td><td class="code">${l.ptrs.map(p=>L(D.billed.dx.indexOf(p))).join(',')}</td></tr>`).join('')}</tbody></table></div>`;
  if (S.chartTab === 'note') body = vNote(D.note, D.enc);
  if (S.chartTab === 'history') body = `<table class="simple"><thead><tr><th>Date</th><th>Event</th><th>Detail</th><th style="text-align:right">Amount</th></tr></thead><tbody>
      ${D.history.map(h => `<tr><td>${h[0]}</td><td><b>${h[1]}</b></td><td>${esc(h[2])}</td><td class="amt">${h[3]}</td></tr>`).join('')}
      ${w.session ? `<tr><td>Today</td><td><b>Charge correction</b></td><td>Session ${w.session} · pending · "${esc(w.comment)}"</td><td></td></tr>` : ''}</tbody></table>`;

  const step = (n, t) => `<span class="${w.step===n?'on':w.step>n?'done':''}"><i>${w.step>n?'✓':n}</i>${t}</span>`;
  let right = '';
  if (w.step === 1){
    right = `<div class="sec"><div class="sh"><h3>What will you do with this denial?</h3></div>
      <div class="decide">
        <button class="opt ${w.decision==='correct'?'on':''}" data-act="decide" data-v="correct"><b>Correct & resubmit</b><span>Our billing error — fix the charge and send a corrected claim.</span></button>
        <button class="opt ${w.decision==='appeal'?'on':''}" data-act="decide" data-v="appeal"><b>Appeal</b><span>The claim was right; ask the payer to reconsider with records.</span></button>
        <button class="opt ${w.decision==='writeoff'?'on':''}" data-act="decide" data-v="writeoff"><b>Write off</b><span>Not collectable — adjust the balance off.</span></button>
      </div>
      <p class="muted" style="font-size:13px">Tip: read the reason codes on the EOB (left) before deciding. ${I.daysToAppeal} days are left to appeal.</p></div>
      <div class="abar"><div class="sp"></div><button class="btn primary" data-act="dstep" data-v="2" ${w.decision?'':'disabled'}>${w.decision==='correct'?'Open charge correction ▸':'Continue ▸'}</button></div>`;
  }
  if (w.step === 2){
    if (w.decision !== 'correct'){
      right = `<div class="sec"><div class="sh"><h3>${w.decision==='appeal'?'Start appeal':'Write off balance'}</h3></div>
        <div class="field"><label>Comment (required)</label><textarea class="inp" data-input="comment" placeholder="Why are you taking this action?">${esc(w.comment)}</textarea></div></div>
        <div class="abar"><button class="btn" data-act="dstep" data-v="1">◂ Back</button><div class="sp"></div><button class="btn primary" data-act="dfinish">Submit ▸</button></div>`;
    } else {
      right = `<div class="pb">${vDx(w, {noRemove:false})}${vLines(w, [], {remit:true, noRemove:true, noAdd:true})}
        <div class="sec"><div class="field"><label>Correction comment (goes on the voided transaction — required)</label>
          <textarea class="inp" data-input="comment" placeholder="e.g. removed 25 from FQHC encounter, re-sequenced diagnoses">${esc(w.comment)}</textarea></div></div></div>
        <div class="abar"><button class="btn" data-act="dstep" data-v="1">◂ Back</button><div class="sp"></div><button class="btn primary" data-act="daccept">Accept correction ▸</button></div>`;
    }
  }
  if (w.step === 3){
    right = `<div class="sec">
      <div class="clean" style="text-align:left;margin:0 0 14px">✓ Correction accepted. Session <span class="code">${w.session}</span> is now <b>pending</b>.</div>
      <table class="simple"><thead><tr><th>Tx</th><th>Code</th><th>Status</th></tr></thead><tbody>${w.lines.map((l,i)=>`<tr><td>${52+i}</td><td class="code">${l.c}${l.mods.filter(Boolean).length?'-'+l.mods.filter(Boolean).join('-'):''}</td><td><span class="pill ok">Corrected</span></td></tr>`).join('')}</tbody></table>
      <p style="font-size:14px;margin:16px 0 8px">Last step: note the pending session number and let the charge review team know it is waiting to be processed.</p>
      <label style="display:flex;gap:10px;align-items:center;font-weight:700"><input type="checkbox" data-act="notify" ${w.notified?'checked':''} style="width:18px;height:18px"> I noted session ${w.session} and notified the charge review team</label></div>
      <div class="abar"><div class="sp"></div><button class="btn primary" data-act="dfinish" ${w.notified?'':'disabled'}>Finish ▸</button></div>`;
  }
  return `
    <div class="wbar"><button class="btn sm" data-act="back">← Back to chart list</button>
      <span class="q">Evaluation &amp; Management<small>${I.num}</small></span><span class="pill err">Denial</span>
      <div class="sp"></div><button class="btn sm" data-act="lookup">⌕ CODIVIA Code Search</button></div>
    ${vBanner(D.pt, D.enc, `<span class="btag">FQHC</span>`)}
    <div class="ws closed" style="grid-template-columns:minmax(420px,1fr) minmax(600px,1.2fr)">
      <div class="card panel">
        <div class="denied"><span class="big">⛔</span><div><b>Claim denied · ${I.daysToAppeal} days left to appeal</b><span class="muted" style="font-size:13px">Billed ${money(I.billed)} · Allowed ${money(I.allowed)} · Payment expected from payer</span></div></div>
        <div class="tabs" style="margin-top:12px">${tabs.map(t => `<button class="tab ${S.chartTab===t[0]?'on':''}" data-act="ctab" data-t="${t[0]}">${t[1]}</button>`).join('')}</div>
        <div class="pb">${body}</div>
      </div>
      <div class="card panel">
        <div class="ph"><h2>Work this denial</h2></div>
        <div class="steps">${step(1,'Decide')}<span class="sep">—</span>${step(2,'Correct')}<span class="sep">—</span>${step(3,'Pending & notify')}</div>
        ${right}
      </div>

    const words = q.split(/\s+/);

    html += `<div class="encres">${hits.length ? hits.map(x => `<div class="er" data-act="encpick" data-c="${x.c}"><span class="code">${x.c}</span><span>${esc(x.d)}<div class="path">${esc(x.path)}</div></span><span>${flags(x)}</span></div>`).join('')
      : '<div class="empty" style="border:none">No index entries. Try the main term (the condition), not the body part.</div>'}</div>`;
  }

        <button class="btn sm ghost" data-act="encclose">Close</button></div></div>`;

}
function applyFind(){
  const doc = $('#ipdoc'); if (!doc) return;
  doc.querySelectorAll('mark.find').forEach(m => m.replaceWith(document.createTextNode(m.textContent)));
  doc.normalize();
  const q = (S.work.find || '').trim().toLowerCase(); if (q.length < 2) return;
  const walker = document.createTreeWalker(doc, NodeFilter.SHOW_TEXT), hits = []; let n;
  while ((n = walker.nextNode())){ const i = n.nodeValue.toLowerCase().indexOf(q); if (i >= 0) hits.push([n, i]); }
  hits.forEach(([node, i]) => { const r = document.createRange(); r.setStart(node, i); r.setEnd(node, i + q.length); const m = document.createElement('mark'); m.className = 'find'; r.surroundContents(m); });
  const first = doc.querySelector('mark.find'); if (first) first.scrollIntoView({block:'center'});
}
function saveDoc(){
  const doc = $('#ipdoc'); if (!doc) return;
  const c = doc.cloneNode(true); c.querySelectorAll('mark.find').forEach(m => m.replaceWith(document.createTextNode(m.textContent)));
  S.work.docHtml[S.work.doc] = c.innerHTML;
}
function unmarkEv(w, ids){
  if (!ids || !ids.length) return;
  Object.keys(w.docHtml).forEach(k => { const div = document.createElement('div'); div.innerHTML = w.docHtml[k];
    div.querySelectorAll('mark.ev').forEach(m => { if (ids.includes(m.dataset.ev)) m.replaceWith(document.createTextNode(m.textContent)); });
    w.docHtml[k] = div.innerHTML; });
  w.evidence = w.evidence.filter(e => !ids.includes(e.id));
}

function onSelPop(e){

document.addEventListener('mouseup', (e) => {

let dragId = null;
document.addEventListener('dragstart', (e) => { const r = e.target.closest && e.target.closest('[data-dx]'); if (!r || !r.classList.contains('dx')) return; dragId = +r.dataset.dx; r.classList.add('dragging'); });
document.addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.dx.dragging,.dx.over').forEach(x => x.classList.remove('dragging','over')); });
document.addEventListener('dragover', (e) => { if (dragId == null) return; const r = e.target.closest('.dx'); if (!r) return; e.preventDefault(); document.querySelectorAll('.dx.over').forEach(x => x.classList.remove('over')); r.classList.add('over'); });
document.addEventListener('drop', (e) => { if (dragId == null) return; const r = e.target.closest('.dx'); if (!r) return; e.preventDefault(); const id = dragId; dragId = null; moveDx(id, S.work.dx.findIndex(d => d.id === +r.dataset.dx)); });

/* inpatient keyboard shortcuts */
document.addEventListener('keydown', (e) => {
  if (S.view !== 'ip' || S.modal) return;
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'k'){ e.preventDefault(); const q = $('#encq'); if (q){ q.focus(); q.select(); } }
  else if (mod && e.key.toLowerCase() === 'f'){ e.preventDefault(); const f = $('input[data-find]'); if (f){ f.focus(); f.select(); } }
  else if (e.altKey && /^[1-4]$/.test(e.key)){ e.preventDefault(); S.work.tab = IP_TABS[+e.key - 1][0]; render(); }
  else if (e.key === 'Escape'){ selPop().hidden = true; S.work.enc.sel = null; encOut(); }
});

// Deep links for review: #coding opens the sample chart, #denial the sample denial, #inpatient / #drg the inpatient chart
if (location.hash === '#inpatient' || location.hash === '#drg'){ S.dept = 'IP'; openIP(location.hash === '#drg' ? 'IP-0398' : 'IP-0412', location.hash === '#drg' ? 'drg' : 'new'); }
else if (location.hash === '#coding') openCoding(NEW_ROWS[0].id, 'new');
else if (location.hash === '#review') openCoding(REVIEW_ROWS[0].id, 'review');
else if (location.hash === '#denial') openDenial(DENIAL_ROWS[0].id);
else if (location.hash === '#dept'){ S.view = 'dept'; render(); }
else render();
</script>
</body>
</html>
